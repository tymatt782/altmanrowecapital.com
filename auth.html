<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Register or login to your Altman Rowe Capital account." />
  <title>Login / Register | Altman Rowe Capital</title>
  <style>
    :root{
      --navy:#0b1f3a;
      --blue:#165dbe;
      --light:#f5f8fc;
      --white:#fff;
      --text:#182536;
      --muted:#637083;
      --line:#dfe6ef;
      --green:#15803d;
      --red:#dc2626;
      --shadow:0 16px 45px rgba(11,31,58,.10);
      --radius:18px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:Inter,Arial,Helvetica,sans-serif;
      color:var(--text);
      background:#fff;
      line-height:1.6;
    }
    a{text-decoration:none;color:inherit}
    .container{width:min(1120px,92%);margin:auto}
    header{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:25px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      font-weight:800;
      color:var(--navy);
      font-size:19px;
    }
    .brand-mark{
      width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;
      display:grid;place-items:center;font-weight:900;
    }

    .auth-container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
      background:linear-gradient(135deg,#f5f9ff 0%,#fff 58%,#eef5ff 100%);
    }
    .auth-box{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:40px;
      box-shadow:var(--shadow);
      max-width:420px;
      width:100%;
    }
    .auth-box h2{
      font-size:32px;
      color:var(--navy);
      margin-bottom:8px;
      text-align:center;
    }
    .auth-box p{
      color:var(--muted);
      text-align:center;
      margin-bottom:30px;
      font-size:14px;
    }
    .form-group{margin-bottom:18px}
    .form-group label{
      display:block;
      font-weight:700;
      font-size:13px;
      margin-bottom:7px;
      color:var(--text);
    }
    .form-group input, .form-group select{
      width:100%;
      padding:13px 14px;
      border:1px solid #cfd8e4;
      border-radius:9px;
      font-size:15px;
      background:#fff;
      outline:none;
    }
    .form-group input:focus, .form-group select:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 3px rgba(22,93,190,.10);
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:0;
      border-radius:10px;
      padding:13px 20px;
      font-weight:700;
      cursor:pointer;
      width:100%;
      margin-top:10px;
    }
    .btn-primary{
      background:var(--blue);
      color:#fff;
    }
    .btn-primary:hover{background:#1349a0}

    .toggle-form{
      text-align:center;
      margin-top:20px;
      font-size:14px;
    }
    .toggle-form a{
      color:var(--blue);
      font-weight:700;
      cursor:pointer;
    }

    .form-message{
      padding:12px;
      border-radius:9px;
      margin-bottom:20px;
      font-size:14px;
    }
    .form-message.error{
      background:#fee2e2;
      color:var(--red);
    }
    .form-message.success{
      background:#dcfce7;
      color:var(--green);
    }
    .hidden{display:none}

    @media(max-width:560px){
      .auth-box{padding:30px 20px}
      .auth-box h2{font-size:26px}
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="/index.html" aria-label="Altman Rowe Capital home">
        <span class="brand-mark">A</span>
        <span>Altman Rowe Capital</span>
      </a>
    </div>
  </header>

  <div class="auth-container">
    <div class="auth-box">
      <div id="loginForm" class="auth-form">
        <h2>Login</h2>
        <p>Access your Altman Rowe Capital account</p>
        <div id="loginMessage" class="form-message hidden"></div>

        <form id="loginFormElement">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input id="loginEmail" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div class="toggle-form">
          Don't have an account? <a onclick="toggleForm()">Register here</a>
        </div>
      </div>

      <div id="registerForm" class="auth-form hidden">
        <h2>Create Account</h2>
        <p>Join Altman Rowe Capital today</p>
        <div id="registerMessage" class="form-message hidden"></div>

        <form id="registerFormElement">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" placeholder="John Doe" required />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input id="phone" type="tel" placeholder="(123) 456-7890" required />
          </div>

          <div class="form-group">
            <label for="address">Address</label>
            <input id="address" type="text" placeholder="123 Main St" required />
          </div>

          <div class="form-group">
            <label for="state">State</label>
            <select id="state" required>
              <option value="">Select a state</option>
              <option value="AL">Alabama</option>
              <option value="AK">Alaska</option>
              <option value="AZ">Arizona</option>
              <option value="AR">Arkansas</option>
              <option value="CA">California</option>
              <option value="CO">Colorado</option>
              <option value="CT">Connecticut</option>
              <option value="DE">Delaware</option>
              <option value="FL">Florida</option>
              <option value="GA">Georgia</option>
              <option value="HI">Hawaii</option>
              <option value="ID">Idaho</option>
              <option value="IL">Illinois</option>
              <option value="IN">Indiana</option>
              <option value="IA">Iowa</option>
              <option value="KS">Kansas</option>
              <option value="KY">Kentucky</option>
              <option value="LA">Louisiana</option>
              <option value="ME">Maine</option>
              <option value="MD">Maryland</option>
              <option value="MA">Massachusetts</option>
              <option value="MI">Michigan</option>
              <option value="MN">Minnesota</option>
              <option value="MS">Mississippi</option>
              <option value="MO">Missouri</option>
              <option value="MT">Montana</option>
              <option value="NE">Nebraska</option>
              <option value="NV">Nevada</option>
              <option value="NH">New Hampshire</option>
              <option value="NJ">New Jersey</option>
              <option value="NM">New Mexico</option>
              <option value="NY">New York</option>
              <option value="NC">North Carolina</option>
              <option value="ND">North Dakota</option>
              <option value="OH">Ohio</option>
              <option value="OK">Oklahoma</option>
              <option value="OR">Oregon</option>
              <option value="PA">Pennsylvania</option>
              <option value="RI">Rhode Island</option>
              <option value="SC">South Carolina</option>
              <option value="SD">South Dakota</option>
              <option value="TN">Tennessee</option>
              <option value="TX">Texas</option>
              <option value="UT">Utah</option>
              <option value="VT">Vermont</option>
              <option value="VA">Virginia</option>
              <option value="WA">Washington</option>
              <option value="WV">West Virginia</option>
              <option value="WI">Wisconsin</option>
              <option value="WY">Wyoming</option>
            </select>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" required />
            <small style="color:var(--muted);font-size:12px;margin-top:5px;display:block">
              Min. 8 characters, include uppercase and number
            </small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <div class="toggle-form">
          Already have an account? <a onclick="toggleForm()">Login here</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "https://your-backend-url.com";

    function toggleForm() {
      document.getElementById("loginForm").classList.toggle("hidden");
      document.getElementById("registerForm").classList.toggle("hidden");
    }

    document.getElementById("loginFormElement").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      const messageDiv = document.getElementById("loginMessage");

      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.className = "form-message success";
          messageDiv.textContent = "Login successful! Redirecting...";
          messageDiv.classList.remove("hidden");

          localStorage.setItem("token", data.token);
          setTimeout(() => window.location.href = "/dashboard.html", 1500);
        } else {
          messageDiv.className = "form-message error";
          messageDiv.textContent = data.message || "Login failed. Please check your credentials.";
          messageDiv.classList.remove("hidden");
        }
      } catch (error) {
        messageDiv.className = "form-message error";
        messageDiv.textContent = "An error occurred. Please try again.";
        messageDiv.classList.remove("hidden");
      }
    });

    document.getElementById("registerFormElement").addEventListener("submit", async (e) => {
      e.preventDefault();

      const messageDiv = document.getElementById("registerMessage");
      const fullName = document.getElementById("fullName").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const address = document.getElementById("address").value;
      const state = document.getElementById("state").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        messageDiv.className = "form-message error";
        messageDiv.textContent = "Passwords do not match.";
        messageDiv.classList.remove("hidden");
        return;
      }

      if (password.length < 8) {
        messageDiv.className = "form-message error";
        messageDiv.textContent = "Password must be at least 8 characters.";
        messageDiv.classList.remove("hidden");
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fullName, email, phone, address, state, password })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.className = "form-message success";
          messageDiv.textContent = "Account created successfully! Logging you in...";
          messageDiv.classList.remove("hidden");

          localStorage.setItem("token", data.token);
          setTimeout(() => window.location.href = "/dashboard.html", 1500);
        } else {
          messageDiv.className = "form-message error";
          messageDiv.textContent = data.message || "Registration failed. Please try again.";
          messageDiv.classList.remove("hidden");
        }
      } catch (error) {
        messageDiv.className = "form-message error";
        messageDiv.textContent = "An error occurred. Please try again.";
        messageDiv.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
