<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Altman Rowe Capital</title>
  <style>
    body { font-family: Inter, Arial, sans-serif; background:#f5f8fc; color:#172033;
           display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .box { background:#fff; border:1px solid #dce5f0; border-radius:18px;
           padding:32px; width:min(420px, 92vw); box-shadow:0 18px 50px rgba(11,31,58,0.10); }
    h2 { color:#0b1f3a; margin-bottom:6px; }
    p  { color:#64748b; font-size:13px; margin-bottom:20px; }
    label { display:block; font-size:13px; font-weight:700; color:#0b1f3a; margin-bottom:6px; }
    input { width:100%; padding:12px; border:1px solid #dce5f0; border-radius:10px;
            font-size:14px; box-sizing:border-box; margin-bottom:14px; }
    button { width:100%; background:#165dbe; color:#fff; border:0; padding:13px;
             border-radius:11px; font-weight:700; cursor:pointer; }
    button:hover { background:#104d9f; }
    .msg { margin-top:12px; font-size:13px; font-weight:600; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Set a new password</h2>
    <p>Enter your new password below.</p>

    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input type="password" id="newPassword" minlength="8" required>

      <label for="confirmNewPassword">Confirm new password</label>
      <input type="password" id="confirmNewPassword" minlength="8" required>

      <button type="submit">Update password</button>
      <p id="msg" class="msg"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://rnzvtrivgdhlfrxlmpxs.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3_pqv5zcVcrVb_qcG7yUOg_xzEBTN-t";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const msg = document.getElementById("msg");

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const p1 = document.getElementById("newPassword").value;
      const p2 = document.getElementById("confirmNewPassword").value;

      if (p1 !== p2) {
        msg.textContent = "Passwords do not match.";
        msg.style.color = "#b91c1c";
        return;
      }

      if (p1.length < 8) {
        msg.textContent = "Password must be at least 8 characters.";
        msg.style.color = "#b91c1c";
        return;
      }

      msg.textContent = "Updating password...";
      msg.style.color = "#64748b";

      const { error } = await supabase.auth.updateUser({ password: p1 });

      if (error) {
        msg.textContent = "Error: " + error.message;
        msg.style.color = "#b91c1c";
        return;
      }

      msg.textContent = "Password updated. Redirecting to sign in...";
      msg.style.color = "#15803d";

      setTimeout(() => {
        window.location.href = "/index.html";
      }, 1500);
    });
  </script>
</body>
</html>
