
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your Altman Rowe Capital dashboard." />
  <title>Dashboard | Altman Rowe Capital</title>
  <style>
    :root{
      --navy:#0b1f3a;
      --blue:#165dbe;
      --light:#f5f8fc;
      --white:#fff;
      --text:#182536;
      --muted:#637083;
      --line:#dfe6ef;
      --green:#15803d;
      --shadow:0 16px 45px rgba(11,31,58,.10);
      --radius:18px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:Inter,Arial,Helvetica,sans-serif;
      color:var(--text);
      background:#f8fafc;
      line-height:1.6;
    }
    a{text-decoration:none;color:inherit}
    .container{width:min(1120px,92%);margin:auto}
    header{
      background:var(--navy);
      color:#fff;
      padding:20px 0;
    }
    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:25px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      font-weight:800;
      font-size:19px;
    }
    .brand-mark{
      width:38px;height:38px;border-radius:10px;background:#fff;color:var(--navy);
      display:grid;place-items:center;font-weight:900;
    }
    .nav-actions{
      display:flex;
      gap:15px;
      align-items:center;
    }
    .btn-logout{
      background:#fff;
      color:var(--navy);
      padding:10px 20px;
      border-radius:8px;
      border:none;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }
    .btn-logout:hover{background:#f0f0f0}

    main{padding:40px 0}
    .welcome-box{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:30px;
      box-shadow:var(--shadow);
      margin-bottom:30px;
    }
    .welcome-box h1{color:var(--navy);margin-bottom:10px}
    .welcome-box p{color:var(--muted)}

    .info-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:20px;
    }
    .info-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:25px;
      box-shadow:var(--shadow);
    }
    .info-card h3{
      color:var(--navy);
      margin-bottom:15px;
      font-size:16px;
    }
    .info-item{
      display:flex;
      justify-content:space-between;
      padding:10px 0;
      border-bottom:1px solid var(--line);
    }
    .info-item:last-child{border-bottom:none}
    .info-label{color:var(--muted);font-size:14px}
    .info-value{color:var(--navy);font-weight:700;font-size:14px}

    @media(max-width:850px){
      .info-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="brand" href="/index.html" aria-label="Altman Rowe Capital home">
        <span class="brand-mark">A</span>
        <span>Altman Rowe Capital</span>
      </a>
      <div class="nav-actions">
        <span id="userNameDisplay" style="font-size:14px"></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="welcome-box">
        <h1>Welcome to Your Dashboard</h1>
        <p>Manage your Altman Rowe Capital account and retirement planning information.</p>
      </div>

      <div class="info-grid">
        <div class="info-card">
          <h3>Account Information</h3>
          <div class="info-item">
            <span class="info-label">Full Name</span>
            <span class="info-value" id="displayFullName">Loading...</span>
          </div>
          <div class="info-item">
            <span class="info-label">Email</span>
            <span class="info-value" id="displayEmail">Loading...</span>
          </div>
          <div class="info-item">
            <span class="info-label">Phone</span>
            <span class="info-value" id="displayPhone">Loading...</span>
          </div>
        </div>

        <div class="info-card">
          <h3>Address Information</h3>
          <div class="info-item">
            <span class="info-label">Address</span>
            <span class="info-value" id="displayAddress">Loading...</span>
          </div>
          <div class="info-item">
            <span class="info-label">State</span>
            <span class="info-value" id="displayState">Loading...</span>
          </div>
          <div class="info-item">
            <span class="info-label">Region</span>
            <span class="info-value">United States</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = "https://your-backend-url.com";

    async function loadUserData() {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/auth.html";
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/auth/profile`, {
          method: "GET",
          headers: { Authorization: `Bearer ${token}` }
        });

        if (response.ok) {
          const user = await response.json();
          document.getElementById("userNameDisplay").textContent = user.fullName;
          document.getElementById("displayFullName").textContent = user.fullName;
          document.getElementById("displayEmail").textContent = user.email;
          document.getElementById("displayPhone").textContent = user.phone;
          document.getElementById("displayAddress").textContent = user.address;
          document.getElementById("displayState").textContent = user.state;
        } else {
          window.location.href = "/auth.html";
        }
      } catch (error) {
        console.error("Error loading user data:", error);
        window.location.href = "/auth.html";
      }
    }

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/auth.html";
    }

    loadUserData();
  </script>
</body>
</html>
