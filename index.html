<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Altman Rowe Capital — banking, digital assets and retirement-focused financial services."
  >

  <meta name="theme-color" content="#0b1f3a">

  <title>Altman Rowe Capital | Banking & Digital Assets</title>

  <style>
    :root {
      --navy: #0b1f3a;
      --navy-2: #102a4c;
      --blue: #165dbe;
      --blue-light: #eaf2ff;
      --green: #15803d;
      --green-light: #eaf8ef;
      --red: #b91c1c;
      --white: #ffffff;
      --light: #f5f8fc;
      --border: #dce5f0;
      --text: #172033;
      --muted: #64748b;
      --shadow: 0 18px 50px rgba(11, 31, 58, 0.10);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      color: var(--navy);
      white-space: nowrap;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: white;
      font-weight: 900;
      font-size: 18px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 14px;
      color: #475569;
    }

    .nav-links a:hover {
      color: var(--blue);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* BUTTONS */
    .btn {
      border: 0;
      border-radius: 11px;
      padding: 12px 18px;
      font-weight: 700;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--blue);
      color: white;
    }

    .btn-primary:hover {
      background: #104d9f;
    }

    .btn-dark {
      background: var(--navy);
      color: white;
    }

    .btn-outline {
      background: white;
      color: var(--navy);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .btn-light {
      background: white;
      color: var(--navy);
    }

    .btn-danger {
      background: #fff1f2;
      color: var(--red);
    }

    /* HERO */
    .hero {
      background:
        radial-gradient(circle at 80% 20%, rgba(22, 93, 190, 0.20), transparent 34%),
        linear-gradient(135deg, #07182c 0%, #0b1f3a 55%, #123866 100%);
      color: white;
      padding: 82px 0 76px;
      overflow: hidden;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 55px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(42px, 5.5vw, 68px);
      line-height: 1.02;
      letter-spacing: -2.8px;
      margin-bottom: 22px;
    }

    .hero p {
      color: #d6e2f1;
      max-width: 640px;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .portfolio-card {
      background: rgba(255,255,255,0.98);
      color: var(--text);
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.25);
    }

    .portfolio-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      margin-bottom: 24px;
    }

    .portfolio-label {
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      background: var(--green-light);
      color: var(--green);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .portfolio-value {
      font-size: 42px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -1.5px;
    }

    .portfolio-change {
      color: var(--green);
      font-weight: 700;
      margin-top: 5px;
    }

    .chart {
      height: 130px;
      margin: 24px 0;
      border-radius: 14px;
      background:
        linear-gradient(to bottom, transparent 49%, #e7edf5 50%, transparent 51%),
        linear-gradient(to right, transparent 49%, #e7edf5 50%, transparent 51%);
      position: relative;
      overflow: hidden;
    }

    .chart svg {
      width: 100%;
      height: 100%;
    }

    .portfolio-bottom {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }

    /* GENERAL SECTIONS */
    section {
      padding: 78px 0;
    }

    .section-heading {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 42px;
    }

    .section-heading h2 {
      color: var(--navy);
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.1;
      margin-bottom: 13px;
      letter-spacing: -1px;
    }

    .section-heading p {
      color: var(--muted);
    }

    /* CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: 0 8px 30px rgba(11,31,58,0.04);
    }

    .icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: var(--blue-light);
      color: var(--blue);
      border-radius: 13px;
      margin-bottom: 18px;
      font-size: 22px;
      font-weight: 800;
    }

    .card h3 {
      color: var(--navy);
      margin-bottom: 9px;
      font-size: 20px;
    }

    .card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* DASHBOARD */
    .dashboard-section {
      background: white;
    }

    .dashboard {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 25px;
      box-shadow: var(--shadow);
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .dashboard-header h3 {
      color: var(--navy);
      font-size: 25px;
    }

    .dashboard-header p {
      color: var(--muted);
      font-size: 13px;
    }

    .balance-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 22px;
    }

    .balance-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .balance-card span {
      color: var(--muted);
      font-size: 13px;
    }

    .balance-card strong {
      display: block;
      font-size: 27px;
      color: var(--navy);
      margin-top: 6px;
    }

    .positive {
      color: var(--green) !important;
    }

    .activity {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .activity-head,
    .activity-row {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 15px;
      padding: 15px 18px;
      align-items: center;
    }

    .activity-head {
      color: var(--muted);
      font-size: 12px;
      background: #f8fafc;
      font-weight: 700;
    }

    .activity-row {
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    /* CRYPTO */
    .crypto {
      background: var(--navy);
      color: white;
    }

    .crypto .section-heading h2 {
      color: white;
    }

    .crypto .section-heading p {
      color: #b9c9dd;
    }

    .market-layout {
      display: grid;
      grid-template-columns: 1.5fr 0.8fr;
      gap: 20px;
    }

    .market-panel,
    .trade-panel {
      background: #102a4c;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 20px;
      overflow: hidden;
    }

    .market-tabs {
      display: flex;
      gap: 5px;
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .market-tab {
      border: 0;
      background: transparent;
      color: #aebfd4;
      padding: 9px 13px;
      border-radius: 9px;
      font-weight: 700;
    }

    .market-tab.active {
      background: rgba(255,255,255,0.10);
      color: white;
    }

    .market-row {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr 1fr;
      gap: 12px;
      padding: 17px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      align-items: center;
      font-size: 13px;
    }

    .market-row:last-child {
      border-bottom: 0;
    }

    .coin {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .coin-logo {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.10);
      border-radius: 50%;
      font-weight: 800;
    }

    .coin-name {
      font-weight: 800;
    }

    .coin-symbol {
      display: block;
      color: #91a5bd;
      font-size: 11px;
    }

    .trade-panel {
      padding: 22px;
    }

    .trade-panel h3 {
      margin-bottom: 18px;
    }

    .trade-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255,255,255,0.07);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .trade-toggle button {
      border: 0;
      background: transparent;
      color: #b8c9dc;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
    }

    .trade-toggle button.active {
      background: white;
      color: var(--navy);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #aebfd4;
      margin-bottom: 6px;
    }

    .field input,
    .field select,
    .form-control {
      width: 100%;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
    }

    .trade-panel .field input,
    .trade-panel .field select {
      background: #0b1f3a;
      color: white;
      border-color: rgba(255,255,255,0.12);
    }

    .trade-note {
      color: #91a5bd;
      font-size: 11px;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* CONSULTATION */
    .consultation {
      background: var(--light);
    }

    .consultation-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 34px;
      box-shadow: var(--shadow);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 140px;
    }

    .consultation-submit {
      margin-top: 20px;
    }

    .form-message {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .web3-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 13px;
    }

    /* HOW IT WORKS */
    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .step {
      text-align: center;
      padding: 28px;
    }

    .step-number {
      width: 52px;
      height: 52px;
      margin: 0 auto 17px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: white;
      font-weight: 800;
    }

    .step h3 {
      margin-bottom: 8px;
      color: var(--navy);
    }

    .step p {
      color: var(--muted);
      font-size: 14px;
    }

    /* SECURITY */
    .security {
      background: white;
    }

    .security-box {
      background: linear-gradient(135deg, #0b1f3a, #123866);
      color: white;
      border-radius: 24px;
      padding: 42px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .security-box h2 {
      font-size: 38px;
      line-height: 1.1;
      margin-bottom: 15px;
    }

    .security-box p {
      color: #c6d5e7;
    }

    .security-list {
      display: grid;
      gap: 13px;
    }

    .security-item {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      color: #e2ebf5;
    }

    .check {
      color: #66d18c;
      font-weight: 900;
    }

    /* FOOTER */
    footer {
      background: #07182c;
      color: white;
      padding: 45px 0 25px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 35px;
      padding-bottom: 30px;
    }

    footer h3 {
      margin-bottom: 12px;
    }

    footer p,
    footer a {
      color: #aebfd4;
      font-size: 13px;
    }

    footer a:hover {
      color: white;
    }

    .footer-links {
      display: grid;
      gap: 8px;
    }

    .copyright {
      border-top: 1px solid rgba(255,255,255,0.10);
      padding-top: 20px;
      color: #8195ad;
      font-size: 12px;
      line-height: 1.7;
    }

    /* MODALS */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(3, 12, 25, 0.72);
      backdrop-filter: blur(5px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(500px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      position: relative;
      box-shadow: 0 30px 100px rgba(0,0,0,0.3);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 16px;
      border: 0;
      background: #f1f5f9;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
    }

    .modal-box h2 {
      color: var(--navy);
      margin-bottom: 7px;
    }

    .modal-box > p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 22px;
    }

    .modal-form {
      display: grid;
      gap: 15px;
    }

    .remember {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .remember label {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .modal-footer-link {
      text-align: center;
      margin-top: 17px;
      color: var(--muted);
      font-size: 13px;
    }

    .modal-footer-link a {
      color: var(--blue);
      font-weight: 700;
    }

    .disclosure {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
      margin-top: 15px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }

    .account-types {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .account-type {
      border: 1px solid var(--border);
      background: white;
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
    }

    .account-type.active {
      border-color: var(--blue);
      background: var(--blue-light);
    }

    .account-type strong {
      display: block;
      color: var(--navy);
      margin-bottom: 3px;
    }

    .account-type span {
      color: var(--muted);
      font-size: 11px;
    }

    .hidden {
      display: none !important;
    }

    /* AUTHENTICATED DASHBOARD */
    .dash-user-head {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: white;
      font-weight: 800;
      font-size: 19px;
      flex-shrink: 0;
    }

    .dash-user-head h3 {
      color: var(--navy);
      font-size: 22px;
      line-height: 1.2;
    }

    .dash-user-head p {
      color: var(--muted);
      font-size: 13px;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--green-light);
      color: var(--green);
    }

    .chip.neutral {
      background: #f1f5f9;
      color: #475569;
    }

    .chip.amber {
      background: #fffbeb;
      color: #b45309;
    }

    .dash-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .notice-bar {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      border-radius: 12px;
      padding: 12px 15px;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .sub-heading {
      color: var(--navy);
      font-size: 16px;
      font-weight: 800;
      margin: 24px 0 12px;
    }

    .portfolio-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .portfolio-item {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .portfolio-item span {
      color: var(--muted);
      font-size: 13px;
      display: block;
    }

    .portfolio-item strong {
      display: block;
      font-size: 24px;
      color: var(--navy);
      margin-top: 6px;
    }

    .pending {
      color: #b45309 !important;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .profile-item {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      font-size: 13px;
    }

    .profile-item span {
      color: var(--muted);
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .profile-item strong {
      color: var(--navy);
      word-break: break-all;
    }

    .signed-out-box {
      text-align: center;
      padding: 50px 20px;
    }

    .signed-out-box h3 {
      color: var(--navy);
      font-size: 24px;
      margin-bottom: 8px;
    }

    .signed-out-box p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    @media (max-width: 650px) {
      .portfolio-split,
      .profile-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ADMIN PANEL */
    .admin-table-wrap {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .admin-table-head,
    .admin-table-row
